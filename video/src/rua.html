}
// ----- obra: 0 = lote vazio, 1 = casa pronta. Piso, paredes subindo em volta, laje, esquadrias. -----
function aplicar({ obra = 1 }) {
  for (const p of pecas) {
    let v;
    if (p.tipo === 'terra') { p.o.visible = obra > 0.001 && obra < 0.999; continue; }
    if (p.tipo === 'piso') v = suave((obra - 0.02) / 0.1);
    else if (p.tipo === 'parede') v = suave((obra - 0.12 - p.ordem * 0.4) / 0.2);
    else if (p.tipo === 'faixa') v = suave((obra - 0.74) / 0.08);
    else if (p.tipo === 'laje') v = suave((obra - 0.7) / 0.1);
    else v = suave((obra - 0.84) / 0.12);
    p.o.visible = v > 0.001;
    if (p.tipo === 'esquadria' || p.tipo === 'faixa' || p.tipo === 'laje') p.o.scale.setScalar(Math.max(v, 0.001));
    else { const h = p.o.geometry.parameters.height; p.o.scale.y = Math.max(v, 0.001); p.o.position.y = (p.o.userData.y0 ??= p.o.position.y - h / 2) + h * Math.max(v, 0.001) / 2; }
  }
}
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 900);
const comp = new EffectComposer(renderer); comp.setPixelRatio(SS); comp.setSize(W, H);
comp.addPass(new RenderPass(cena, camera));
const ao = new GTAOPass(cena, camera, W * SS, H * SS); ao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1.4, thickness: 1.2, scale: 1.25, samples: 16 }); comp.addPass(ao);
comp.addPass(new OutputPass());
// pos e alvo em metros, com origem no meio da frente do lote: x para a direita, y para cima, z para o fundo (rua = z negativo)
window.desenhar = (estado, cam) => {
  aplicar(estado);
  camera.fov = cam.fov || 50; camera.updateProjectionMatrix();
  camera.position.set(LW / 2 - cam.pos[0], cam.pos[1], cam.pos[2]); camera.lookAt(LW / 2 - cam.alvo[0], cam.alvo[1], cam.alvo[2]);
  comp.render();
};
window.medidas = { LW, LD, OX, OZ, LARGURA, PROFUNDIDADE };
window.pronto = true;
