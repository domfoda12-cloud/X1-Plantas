<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Plantas: vídeo 9:16</title>
<style>
  :root {
    --azul: #0B4FA8;
    --azul-escuro: #083B80;
    --branco: #FFFFFF;
    --azul-claro: #BFD4F2;
    --destaque: #FFC857;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Inter', 'DejaVu Sans', sans-serif; color: var(--branco); position: relative; }

  /* Fundo provisório: só aparece no modo "fundo", que vira a base do rascunho. */
  #fundo { position: absolute; inset: 0; display: none;
    background: linear-gradient(180deg, #4A4038 0%, #2F2924 100%); }
  #fundo .silhueta { position: absolute; left: 50%; top: 820px; transform: translateX(-50%);
    width: 520px; height: 1100px; border-radius: 260px 260px 0 0; background: #5A4F45; }
  #fundo .cabeca { position: absolute; left: 50%; top: 560px; transform: translateX(-50%);
    width: 300px; height: 360px; border-radius: 50%; background: #5A4F45; }
  #fundo .aviso { position: absolute; left: 0; right: 0; top: 1640px; text-align: center;
    color: #CBBFAF; font-size: 34px; font-weight: 600; letter-spacing: 3px; }
  body.modo-fundo #fundo { display: block; }
  body.modo-fundo #camada { display: none; }

  #camada { position: absolute; inset: 0; }

  /* Tela cheia em 3D (gancho e resposta) */
  #tres { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: none; }
  #vinheta { position: absolute; left: 0; right: 0; top: 1020px; height: 560px; display: none;
    background: radial-gradient(ellipse 70% 50% at 50% 50%, rgba(5,20,45,.55) 0%, rgba(5,20,45,0) 100%); }

  /* Cartão no terço superior, em estilo blueprint */
  #cartao { position: absolute; left: 90px; top: 140px; width: 900px; height: 640px;
    background: var(--azul); border-radius: 28px; overflow: hidden; opacity: 0;
    box-shadow: 0 18px 50px rgba(0,0,0,.4); border: 3px solid rgba(255,255,255,.35); }
  #cartao .rotulo { height: 78px; padding: 0 34px; display: flex; align-items: center;
    justify-content: space-between; background: var(--azul-escuro); border-bottom: 2px solid rgba(255,255,255,.25); }
  #cartao .rotulo b { font-size: 32px; font-weight: 700; color: var(--branco); letter-spacing: .5px; }
  #cartao .rotulo span { font-size: 26px; font-weight: 600; color: var(--azul-claro); }
  #cartao .conteudo { position: absolute; left: 0; top: 80px; width: 900px; height: 560px; }
  #cartao svg { position: absolute; left: 0; top: 0; width: 900px; height: 560px; }

  /* Legendas no meio da tela, como na referência */
  #legenda { position: absolute; left: 40px; right: 40px; top: 1190px; text-align: center; color: #fff;
    text-shadow: 0 3px 12px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.9); }
  #legenda .titulo { font-size: 68px; font-weight: 800; line-height: 1.1; min-height: 76px; }
  #legenda .titulo.gancho { font-size: 58px; }
  #legenda .palavra { font-size: 66px; font-weight: 600; margin-top: 26px; min-height: 80px; }
</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head>
<body>
  <div id="fundo">
    <div class="cabeca"></div>
    <div class="silhueta"></div>
    <div class="aviso">GRAVAÇÃO DO APRESENTADOR AQUI</div>
  </div>
  <div id="camada">
    <canvas id="tres"></canvas>
    <div id="vinheta"></div>
    <div id="cartao">
      <div class="rotulo"><b id="rotulo-titulo"></b><span id="rotulo-info"></span></div>
      <div class="conteudo" id="desenho"></div>
    </div>
    <div id="legenda"><div class="titulo" id="leg-titulo"></div><div class="palavra" id="leg-palavra"></div></div>
  </div>
  <script type="module" src="./cena.js"></script>
</body>
</html>
