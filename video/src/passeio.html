<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Passeio por dentro da casa (motor próprio)</title>
<style>html, body { margin: 0; overflow: hidden; background: #F3E3C8; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<canvas id="tela"></canvas>
<script type="module">
  // Passeio na altura dos olhos, por dentro da casa mobiliada do motor 3D (a mesma de casa.html), com teto e luz quente.
  // É ilustração do modelo 3D, não foto. Página de quadro único: window.desenhar(u) com u de 0 a 1 ao longo do caminho.
  // ?planta=F03&caminho=x,z;x,z;...  (metros da planta: x para a direita, z da frente para os fundos)
  import * as THREE from '../node_modules/three/build/three.module.js';
  import { criarCasa } from './casa3d.js';
  const q = new URLSearchParams(location.search);
  const W = Number(q.get('w') || 1080), H = Number(q.get('h') || 1920), SS = Number(q.get('ss') || 1.25);
  const D = await import(`./plantas/${q.get('planta')}.js`);
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('tela'), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(SS); renderer.setSize(W, H);
  const casa = criarCasa(renderer);
  const ALT = D.PE_DIREITO || 2.8;
  casa.aplicar({ desenho: 1, paredes: 1, vida: 1, corte: ALT });
  renderer.toneMappingExposure = Number(q.get('exp') || 1.0);

  // céu de fim de tarde no lugar do azul de projeto, e sol baixo e quente entrando de lado
  casa.cena.background = new THREE.Color(q.get('ceu') || '#F6E2BF');
  casa.cena.traverse((o) => {
    if (o.isDirectionalLight) { o.color.set(q.get('sol') || '#FFD9A0'); o.intensity = 2.4; o.position.set(D.LARGURA / 2 - 9, 13, D.PROFUNDIDADE / 2 - 7); }
    if (o.isHemisphereLight) { o.color.set('#FFF4E2'); o.groundColor.set('#C9A77C'); o.intensity = 1.25; }
  });
  // teto e vergas: o teto não faz sombra, para a luz continuar uniforme em todos os cômodos
  const branco = new THREE.MeshStandardMaterial({ color: '#FBF7EF', roughness: 0.95, side: THREE.DoubleSide });
  const fechados = D.ambientes.filter((a) => !['varanda', 'garagem', 'patio', 'jardim', 'futuro', 'quintal'].includes(a.tipo));
  for (const a of D.ambientes) {
    const teto = new THREE.Mesh(new THREE.PlaneGeometry(a.x1 - a.x0, a.y1 - a.y0), branco);
    teto.rotation.x = Math.PI / 2; teto.position.set((a.x0 + a.x1) / 2, ALT, (a.y0 + a.y1) / 2); casa.cena.add(teto);
    if (fechados.includes(a)) { // uma luz quente e fraca no meio de cada cômodo
      const l = new THREE.PointLight('#FFE2B8', 5, 9, 1.6); l.position.set((a.x0 + a.x1) / 2, ALT - 0.35, (a.y0 + a.y1) / 2); casa.cena.add(l);
    }
  }
  const E = D.ESPESSURA || 0.15;
  for (const p of D.portas) { // verga em cima de cada porta (2,1 m)
    const cx = p.x + Math.cos(p.a0) * p.r / 2, cz = p.y + Math.sin(p.a0) * p.r / 2, h = Math.abs(Math.cos(p.a0)) > 0.5;
    const v = new THREE.Mesh(new THREE.BoxGeometry(h ? p.r : E, ALT - 2.1, h ? E : p.r), branco); v.position.set(cx, 2.1 + (ALT - 2.1) / 2, cz); casa.cena.add(v);
  }
  for (const j of D.janelas) { // verga em cima de cada janela
    const [x0, y0, x1, y1] = j.seg, h = y0 === y1, c = Math.hypot(x1 - x0, y1 - y0);
    const v = new THREE.Mesh(new THREE.BoxGeometry(h ? c : E, ALT - j.verga, h ? E : c), branco); v.position.set((x0 + x1) / 2, j.verga + (ALT - j.verga) / 2, (y0 + y1) / 2); casa.cena.add(v);
  }

  const pts = q.get('caminho').split(';').map((s) => s.split(',').map(Number)).map(([x, z]) => new THREE.Vector3(x, 0, z));
  const curva = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  const OLHO = Number(q.get('olho') || 1.45), FOV = Number(q.get('fov') || 78), FRENTE = Number(q.get('frente') || 1.6);
  const cam = casa.camera; cam.fov = FOV; cam.aspect = W / H; cam.near = 0.08; cam.up.set(0, 1, 0); cam.updateProjectionMatrix();
  const comprimento = curva.getLength();
  window.desenhar = (u) => {
    const p = curva.getPointAt(Math.min(1, Math.max(0, u)));
    // olha para a média de pontos à frente no caminho: a virada sai macia, sem tranco
    const alvo = new THREE.Vector3(); let n = 0;
    for (let d = FRENTE * 0.5; d <= FRENTE * 1.5; d += FRENTE / 8) { const uu = u + d / comprimento; alvo.add(uu <= 1 ? curva.getPointAt(uu) : curva.getPointAt(1).add(curva.getTangentAt(1).multiplyScalar((uu - 1) * comprimento))); n++; }
    alvo.divideScalar(n);
    cam.position.set(p.x, OLHO, p.z); cam.lookAt(alvo.x, OLHO - 0.12, alvo.z);
    casa.render();
  };
  window.vistaDeCima = () => { cam.fov = 40; cam.updateProjectionMatrix(); cam.position.set(D.LARGURA / 2, 26, D.PROFUNDIDADE / 2); cam.up.set(0, 0, -1); cam.lookAt(D.LARGURA / 2, 0, D.PROFUNDIDADE / 2);
    casa.cena.traverse((o) => { if (o.material === branco && o.geometry.type === 'PlaneGeometry') o.visible = false; });
    const g = new THREE.BufferGeometry().setFromPoints(curva.getSpacedPoints(200).map((v) => v.setY(2.9))); casa.cena.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 'red' }))); casa.render(); };
  window.comprimento = comprimento;
  document.fonts.ready.then(() => { window.pronto = true; });
</script>
</body>
</html>
