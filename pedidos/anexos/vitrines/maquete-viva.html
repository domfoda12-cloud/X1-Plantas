<title>Antes do Primeiro Tijolo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: uma tela só. A casa ocupa tudo; em cima, o nome; embaixo, uma trena amarela que é o controle. */
:root{ --azul:#0B4FA8; --azul-fundo:#083B80; --branco:#FFFFFF; --nevoa:#CFE0F7; --trena:#FFC857; --trena-tinta:#2A2108;
  --tit:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif; --txt:"Inter",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--azul);color:var(--branco);font:15px/1.45 var(--txt);overflow:hidden;position:relative;-webkit-user-select:none;user-select:none}
canvas#tela{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#tela:active{cursor:grabbing}
.topo{position:absolute;left:0;right:0;top:0;pointer-events:none;
  padding:18px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.topo>*{pointer-events:auto}
.marca{font:500 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--trena);margin:0 0 6px}
h1{font:800 clamp(1.7rem,5vw,3rem)/1 var(--tit);letter-spacing:-.03em;margin:0;text-shadow:0 2px 0 var(--azul-fundo)}
.ficha{font:500 12px var(--mono);color:var(--nevoa);margin:8px 0 0;min-height:1.4em}
.casas{display:flex;gap:6px;flex-wrap:wrap}
.casas button{font:600 13px var(--txt);color:var(--branco);background:rgba(8,59,128,.75);border:1.5px solid rgba(255,255,255,.45);
  padding:8px 13px;border-radius:99px;cursor:pointer}
.casas button[aria-pressed="true"]{background:var(--trena);color:var(--trena-tinta);border-color:var(--trena)}
.casas button:focus-visible,.replay:focus-visible{outline:3px solid var(--branco);outline-offset:2px}

.base{position:absolute;left:0;right:0;bottom:0}
.fase{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.fase>div{background:rgba(8,59,128,.86);padding:9px 12px;border-radius:10px;min-width:0}
.fase b{font:700 clamp(1.05rem,3.4vw,1.5rem)/1.1 var(--tit);text-shadow:0 2px 0 var(--azul-fundo)}
.fase span{display:block;font:500 12px var(--txt);color:var(--nevoa);margin-top:3px;max-width:44ch}
.replay{pointer-events:auto;flex:0 0 auto;font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  background:var(--azul-fundo);color:var(--branco);border:1.5px solid rgba(255,255,255,.5);border-radius:99px;padding:8px 12px;cursor:pointer}
.trena{position:relative;background:var(--trena);color:var(--trena-tinta);height:64px;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 0 rgba(0,0,0,.18)}
.trena .regua{position:absolute;inset:0 0 auto 0;height:64px;
  background-image:
    repeating-linear-gradient(90deg,var(--trena-tinta) 0 2px,transparent 2px 10%),
    repeating-linear-gradient(90deg,var(--trena-tinta) 0 1px,transparent 1px 1%);
  background-size:100% 20px,100% 9px;background-repeat:no-repeat;background-position:0 0,0 0}
.trena .marcas{position:absolute;left:0;right:0;top:26px;display:flex;justify-content:space-between;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.trena .feito{position:absolute;left:0;top:0;height:64px;background:rgba(42,33,8,.14);pointer-events:none}
.trena .ponta{position:absolute;top:-10px;width:4px;height:74px;margin-left:-2px;background:#D9372B;pointer-events:none;border-radius:2px}
.trena .ponta::before{content:"";position:absolute;left:-9px;top:-4px;width:22px;height:14px;background:#D9372B;border-radius:3px}
.trena input{position:absolute;inset:-12px 0 0 0;width:100%;height:76px;margin:0;opacity:0;cursor:ew-resize}
.aviso{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:600 15px var(--txt);pointer-events:none}
.aviso[hidden]{display:none}
.dica{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;
  background:var(--azul-fundo);border:1.5px solid rgba(255,255,255,.5);padding:8px 12px;border-radius:99px;pointer-events:none;opacity:0;transition:opacity .5s}
.dica.on{opacity:1}
@media (prefers-reduced-motion:reduce){.dica{transition:none}}
</style>

<canvas id="tela" aria-label="Maquete 3D da casa. Arraste para girar."></canvas>
<p class="aviso" id="aviso">Riscando a planta…</p>
<p class="dica" id="dica">arraste para girar a casa</p>

<div class="topo">
  <div>
    <p class="marca">X1-Plantas · e-book de plantas de casas</p>
    <h1>Antes do primeiro tijolo</h1>
    <p class="ficha" id="ficha"></p>
  </div>
  <div class="casas" id="casas" role="group" aria-label="Escolha a casa">
    <button type="button" data-id="C01" aria-pressed="true">Compacta</button>
    <button type="button" data-id="E03" aria-pressed="false">Fita</button>
    <button type="button" data-id="F01" aria-pressed="false">Família</button>
  </div>
</div>

<div class="base">
  <div class="fase">
    <div><b id="fase-t">No papel</b><span id="fase-d">Puxe a trena para levantar a casa.</span></div>
    <button type="button" class="replay" id="replay">Construir de novo</button>
  </div>
  <div class="trena">
    <div class="regua"></div><div class="feito" id="feito"></div>
    <div class="marcas"><span>papel</span><span>parede</span><span>piso e móveis</span><span>casa</span></div>
    <div class="ponta" id="ponta"></div>
    <input type="range" id="obra" min="0" max="1000" value="0" aria-label="Andamento da obra">
  </div>
</div>

<script type="module">
import * as THREE from './lib/three.module.min.js';

const tela = document.getElementById('tela'), aviso = document.getElementById('aviso'), dica = document.getElementById('dica');
const obra = document.getElementById('obra'), ponta = document.getElementById('ponta'), feito = document.getElementById('feito');
const faseT = document.getElementById('fase-t'), faseD = document.getElementById('fase-d'), ficha = document.getElementById('ficha');
const semMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: tela, antialias: true }); }
catch (e) { aviso.textContent = 'Este aparelho não abriu o 3D. Tente em outro navegador.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

const MODULOS = { C01: () => import('./casa-C01.js'), E03: () => import('./casa-E03.js'), F01: () => import('./casa-F01.js') };
const DADOS = { C01: () => import('./plantas/C01.js'), E03: () => import('./plantas/E03.js'), F01: () => import('./plantas/F01.js') };
const casas = {};            // id -> { casa, dados }
let atual = null, t = 0, giro = 0.55, zoom = 1, sujo = true, tocando = null, mexeu = false;

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const suave = (v) => { v = clamp(v); return v * v * (3 - 2 * v); };
const num = (n) => String(n).replace('.', ',');

const FASES = [
  [0.00, 'No papel', 'A planta riscada com as medidas de verdade.'],
  [0.30, 'As paredes sobem', 'Cada parede nasce da linha que você acabou de ver.'],
  [0.58, 'Piso e móveis', 'Móveis no tamanho de loja, para ver se cabe.'],
  [0.92, 'A casa', 'Nenhuma imagem pronta: tudo aqui é desenhado por código, a partir das medidas.'],
];

function desenhar() {
  if (!atual) return;
  const { casa, dados } = atual;
  const w = tela.clientWidth, h = tela.clientHeight, aspecto = w / h;
  if (tela.width !== Math.round(w * renderer.getPixelRatio()) || tela.height !== Math.round(h * renderer.getPixelRatio())) renderer.setSize(w, h, false);
  casa.aplicar({ desenho: clamp(t / 0.28), paredes: clamp((t - 0.28) / 0.3), vida: clamp((t - 0.5) / 0.45), corte: 1.1 });
  const sobe = suave((t - 0.22) / 0.4);
  const maior = Math.max(dados.LARGURA, dados.PROFUNDIDADE);
  const cabe = Math.max(1, 0.82 / aspecto) * (1 + 0.12 * (1 - sobe));
  casa.enquadrar({
    theta: giro * sobe, inclinacao: 0.02 + 0.78 * sobe,
    distancia: (maior * 2.25 + 5) * cabe / zoom, fov: 30, alvo: [0, 0.6 * (1 - sobe)], aspecto,
  });
  casa.render();
  const f = FASES.filter((x) => t >= x[0]).pop();
  if (faseT.textContent !== f[1]) { faseT.textContent = f[1]; faseD.textContent = f[2]; }
  ponta.style.left = feito.style.width = (t * 100) + '%';
}
function laco() { if (sujo) { sujo = false; desenhar(); } requestAnimationFrame(laco); }

function ir(v) { t = clamp(v); obra.value = Math.round(t * 1000); sujo = true; }
function construir() {
  cancelAnimationFrame(tocando);
  if (semMovimento) { ir(1); return; }
  const ini = performance.now(), dur = 9000; ir(0);
  const passo = (agora) => { const p = (agora - ini) / dur; ir(p); if (p < 1) tocando = requestAnimationFrame(passo); else if (!mexeu) { dica.classList.add('on'); setTimeout(() => dica.classList.remove('on'), 3200); } };
  tocando = requestAnimationFrame(passo);
}

async function escolher(id) {
  document.querySelectorAll('#casas button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id));
  if (!casas[id]) {
    aviso.hidden = false;
    const [mod, dados] = await Promise.all([MODULOS[id](), DADOS[id]()]);
    casas[id] = { casa: mod.criarCasa(renderer), dados };
  }
  atual = casas[id]; aviso.hidden = true;
  const m = atual.dados.META;
  ficha.textContent = `${m.nome} · ${num(Math.round(m.area))} m² · ${m.quartos} · lote ${m.lote[0]} x ${m.lote[1]} m`;
  construir();
}

obra.addEventListener('input', () => { cancelAnimationFrame(tocando); ir(obra.value / 1000); });
document.getElementById('replay').addEventListener('click', construir);
document.getElementById('casas').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) escolher(b.dataset.id); });

// girar (arrastar) e aproximar (roda ou pinça)
const dedos = new Map(); let pinca = 0;
tela.addEventListener('pointerdown', (e) => { tela.setPointerCapture(e.pointerId); dedos.set(e.pointerId, e); });
tela.addEventListener('pointermove', (e) => {
  const antes = dedos.get(e.pointerId); if (!antes) return;
  if (dedos.size === 1) { giro -= (e.clientX - antes.clientX) * 0.008; mexeu = true; dica.classList.remove('on'); }
  dedos.set(e.pointerId, e);
  if (dedos.size === 2) { const [a, b] = [...dedos.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinca) zoom = clamp(zoom * d / pinca, 0.7, 2.6); pinca = d; }
  sujo = true;
});
const solta = (e) => { dedos.delete(e.pointerId); pinca = 0; };
tela.addEventListener('pointerup', solta); tela.addEventListener('pointercancel', solta);
tela.addEventListener('wheel', (e) => { e.preventDefault(); zoom = clamp(zoom * Math.exp(-e.deltaY * 0.0012), 0.7, 2.6); sujo = true; }, { passive: false });
addEventListener('resize', () => { sujo = true; });

await document.fonts.ready.catch(() => {});
await escolher('C01');
laco();
</script>
